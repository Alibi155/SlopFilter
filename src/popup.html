<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SlopFilter</title>
    <link rel="stylesheet" href="./popup/ui.css" />
  </head>
  <body class="sf-popup">
    <header class="sf-head">
      <h1>SlopFilter</h1>
      <label class="sf-switch">
        <input type="checkbox" id="enabled" />
        <span>On</span>
      </label>
    </header>

    <p class="sf-health" id="health" hidden></p>

    <section class="sf-field">
      <label for="threshold">
        Sensitivity
        <output id="threshold-value">60%</output>
      </label>
      <input type="range" id="threshold" min="30" max="90" step="5" />
      <p class="sf-hint">Lower catches more posts. Higher only catches the obvious ones.</p>
    </section>

    <section class="sf-field">
      <span class="sf-label">When a post is slop</span>
      <div class="sf-radios">
        <label><input type="radio" name="mode" value="dim" /> Grey it out</label>
        <label><input type="radio" name="mode" value="collapse" /> Collapse it</label>
      </div>
    </section>

    <section class="sf-stats">
      <div><strong id="stat-scanned">0</strong><span>scanned</span></div>
      <div><strong id="stat-flagged">0</strong><span>flagged</span></div>
      <div><strong id="stat-corrections">0</strong><span>corrections</span></div>
    </section>

    <p class="sf-learning" id="learning"></p>

    <footer class="sf-foot">
      <button type="button" id="open-options">Settings &amp; keywords</button>
      <span class="sf-privacy">Runs 100% on your device</span>
    </footer>

    <script type="module" src="./popup/popup.ts"></script>
  </body>
</html>
