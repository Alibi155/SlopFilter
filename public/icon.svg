<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    A feed card, half of it greyed out: the whole product in one glyph.
    Kept to flat shapes with no strokes under 4px so it survives at 16×16.
  -->
  <rect width="128" height="128" rx="28" fill="#0a66c2" />

  <!-- Left half: a legible post. -->
  <g fill="#ffffff">
    <circle cx="38" cy="42" r="10" />
    <rect x="54" y="36" width="34" height="8" rx="4" />
    <rect x="54" y="50" width="22" height="6" rx="3" opacity="0.7" />
    <rect x="24" y="70" width="80" height="9" rx="4.5" />
    <rect x="24" y="87" width="60" height="9" rx="4.5" />
  </g>

  <!-- Right half: the same card, dimmed. -->
  <path d="M64 0h36a28 28 0 0 1 28 28v72a28 28 0 0 1-28 28H64z" fill="#0a66c2" opacity="0.55" />
  <path
    d="M64 0h36a28 28 0 0 1 28 28v72a28 28 0 0 1-28 28H64z"
    fill="#000000"
    opacity="0.28"
  />
</svg>
